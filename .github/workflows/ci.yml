name: Blueberry checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blueberry-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Check syntax and committed generated pages
        run: npm run check
      - name: Verify authentication and database behavior
        run: npm test
      - name: Verify reproducible build
        run: |
          npm run build
          git diff --exit-code -- index.html owner.html apply.html
